name: CI

# Runs the project's real checks on every push and pull request, so a branch
# cannot be merged (or deployed) without audit, typecheck and build passing.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: audit / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Deterministic, non-production canonical origin. This is a reserved TLD
      # (.test) so a CI artefact can never point at the real domain or the
      # parked landing page. Preview-mode builds are exercised separately below.
      SITE_URL: https://ci.calculatedaily.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit calculators (content + integrity + edge cases)
        run: npm run audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (vite + prerender)
        run: npm run build

      - name: Assert sitemap has no duplicate URLs
        run: |
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("dist/sitemap.xml", "utf8");
            const urls = [...s.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            const dupes = [...new Set(urls.filter((u, i) => urls.indexOf(u) !== i))];
            if (dupes.length) { console.error("duplicate sitemap URLs:", dupes); process.exit(1); }
            console.log("sitemap urls:", urls.length, "all unique");
            if (urls.length < 100) { console.error("sitemap unexpectedly small"); process.exit(1); }
          '

      - name: Assert calculator slugs are unique in the sitemap
        run: |
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("dist/sitemap.xml", "utf8");
            const calcs = (s.match(/\/calculators\/[^<]+/g) || []);
            const unique = new Set(calcs).size;
            console.log("calculator urls:", calcs.length, "unique:", unique);
            if (calcs.length !== unique) { console.error("duplicate calculator URLs"); process.exit(1); }
            if (calcs.length === 0) { console.error("no calculator URLs found"); process.exit(1); }
          '

      - name: Assert 404 is noindex with no canonical
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("dist/404.html", "utf8");
            const noindex = /name="robots" content="noindex"/.test(h);
            const canonical = /rel="canonical"/.test(h);
            console.log({ noindex, canonical });
            if (!noindex || canonical) { console.error("404 SEO regression"); process.exit(1); }
          '

      - name: Assert canonical host matches SITE_URL
        run: |
          node -e '
            const fs = require("fs");
            const expected = process.env.SITE_URL;
            for (const f of ["dist/index.html", "dist/calculators/mortgage-calculator.html"]) {
              const h = fs.readFileSync(f, "utf8");
              const m = h.match(/rel="canonical" href="([^"]+)"/);
              if (!m) { console.error("missing canonical in", f); process.exit(1); }
              if (!m[1].startsWith(expected)) {
                console.error("wrong canonical in", f, m[1], "expected prefix", expected);
                process.exit(1);
              }
            }
            console.log("canonical host ok:", expected);
          '

      # Proves a Vercel preview build degrades safely: noindex everywhere, empty sitemap.
      - name: Build in preview mode and assert it is not indexable
        env:
          SITE_URL: ''
          VERCEL_ENV: preview
          VERCEL_URL: ci-preview.vercel.app
        run: |
          npm run build
          node -e '
            const fs = require("fs");
            const sitemap = fs.readFileSync("dist/sitemap.xml", "utf8");
            if (/<loc>/.test(sitemap)) { console.error("preview sitemap must be empty"); process.exit(1); }
            const page = fs.readFileSync("dist/calculators/mortgage-calculator.html", "utf8");
            if (!/name="robots" content="noindex"/.test(page)) {
              console.error("preview page must be noindex"); process.exit(1);
            }
            if (/rel="canonical"/.test(page)) {
              console.error("preview page must not emit a canonical"); process.exit(1);
            }
            console.log("preview mode: noindex, no canonical, empty sitemap");
          '

      - name: Assert production build without SITE_URL fails loudly
        env:
          SITE_URL: ''
          VERCEL_ENV: production
          VERCEL_URL: example.vercel.app
        run: |
          if npm run build > /tmp/prod-guard.log 2>&1; then
            echo "BUILD SHOULD HAVE FAILED without SITE_URL in production"
            tail -n 40 /tmp/prod-guard.log
            exit 1
          fi
          if ! grep -q "SITE_URL is required for production builds" /tmp/prod-guard.log; then
            echo "build failed but not with the SITE_URL guard"
            tail -n 40 /tmp/prod-guard.log
            exit 1
          fi
          echo "production guard fired as expected"
