    <script>
      // Defensively define fetch getter/setter to prevent 'Cannot set property fetch of #<Window> which has only a getter' errors
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch.bind(window);
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch || originalFetch;
            },
            set(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Silently handle if property definition is restricted
      }
    </script>
    <script>
      // Apply the saved (or system) theme before first paint so dark-mode
      // visitors never see a flash of the light palette.
      (function () {
        try {
          var stored = localStorage.getItem('calculate_daily_theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
